<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Catering - Resto Cafetaria</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #36393f;
            padding: 25px;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h2 {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 2px solid #4f545c;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #202225;
            background-color: #40444b;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #7289da;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #5865f2;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #4752c4;
        }
        .result-box {
            margin-top: 20px;
            background-color: #2f3136;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            border: 1px solid #202225;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📄 FORM CATERING RESTO CAFETARIA</h2>
    
    <div class="form-group">
        <label>NAMA IC:</label>
        <input type="text" id="namaIc" placeholder="Masukkan Nama IC">
    </div>

    <div class="form-group">
        <label>NO. HP IC:</label>
        <input type="text" id="noHp" placeholder="Masukkan No. HP IC">
    </div>

    <div class="form-group">
        <label>DETAIL CATERING / MENU:</label>
        <textarea id="detailCatering" rows="3" placeholder="Contoh: 50x Burger, 50x Cola"></textarea>
    </div>

    <div class="form-group">
        <label>JUMLAH (PORSI/PAKET):</label>
        <input type="number" id="jumlah" placeholder="Contoh: 50">
    </div>

    <div class="form-group">
        <label>KEPERLUAN:</label>
        <input type="text" id="keperluan" placeholder="Contoh: Acara Event / Stok Family">
    </div>

    <div class="form-group">
        <label>TANGGAL PESAN:</label>
        <input type="date" id="tglPesan">
    </div>

    <div class="form-group">
        <label>TANGGAL AMBIL / ANTAR:</label>
        <input type="date" id="tglAmbil">
    </div>

    <div class="form-group">
        <label>METODE:</label>
        <select id="metode" onchange="toggleLokasi()">
            <option value="AMBIL DI RESTO">AMBIL DI RESTO (Gratis)</option>
            <option value="DIANTAR">DIANTAR (Sesuai Wilayah)</option>
        </select>
    </div>

    <div class="form-group" id="lokasiGroup" style="display: none;">
        <label>WILAYAH PENGANTARAN:</label>
        <select id="lokasi">
            <option value="LS ($1.500)">Los Santos ($1.500)</option>
            <option value="LV ($3.000)">Las Venturas ($3.000)</option>
            <option value="SF ($2.500)">San Fierro ($2.500)</option>
        </select>
    </div>

    <div class="form-group">
        <label>JAM (WIB):</label>
        <input type="time" id="jam">
    </div>

    <div class="form-group">
        <label>CATATAN (NOTE):</label>
        <input type="text" id="note" placeholder="Catatan tambahan (Opsional)">
    </div>

    <button onclick="generateForm()">Generate & Copy Form</button>

    <div class="result-box" id="output" style="display:none;"></div>
</div>

<script>
    function toggleLokasi() {
        const metode = document.getElementById('metode').value;
        const lokasiGroup = document.getElementById('lokasiGroup');
        lokasiGroup.style.display = (metode === 'DIANTAR') ? 'block' : 'none';
    }

    function generateForm() {
        const namaIc = document.getElementById('namaIc').value || '-';
        const noHp = document.getElementById('noHp').value || '-';
        const detailCatering = document.getElementById('detailCatering').value || '-';
        const jumlah = document.getElementById('jumlah').value || '-';
        const keperluan = document.getElementById('keperluan').value || '-';
        const tglPesan = document.getElementById('tglPesan').value || '-';
        const tglAmbil = document.getElementById('tglAmbil').value || '-';
        const metode = document.getElementById('metode').value;
        const lokasi = (metode === 'DIANTAR') ? document.getElementById('lokasi').value : 'RESTO CAFETARIA';
        const jam = document.getElementById('jam').value || '-';
        const note = document.getElementById('note').value || '-';

        const resultText = `📄 **FORM PEMESANAN CATERING RESTO CAFETARIA**

NAMA IC       : ${namaIc}
NO. HP IC     : ${noHp}
DETAIL MENU   : ${detailCatering}
JUMLAH        : ${jumlah}
KEPERLUAN     : ${keperluan}
TANGGAL PESAN : ${tglPesan}
TANGGAL AMBIL : ${tglAmbil}
ANTAR/AMBIL   : ${metode}
JAM           : ${jam}
LOKASI        : ${lokasi}

NOTE : ${note}

📋 **REGULASI PENGANTARAN**
• LS = $1.500
• LV = $3.000
• SF = $2.500

❗ PENGAMBILAN DI RESTO TIDAK DIKENAKAN BIAYA APAPUN
❗ JIKA ADA KESALAHAN PEMBAYARAN BISA HUBUNGI PENGELOLA RESTO`;

        const outputDiv = document.getElementById('output');
        outputDiv.style.display = 'block';
        outputDiv.innerText = resultText;

        navigator.clipboard.writeText(resultText);
        alert('Form Catering berhasil dibuat & disalin ke clipboard!');
    }
</script>

</body>
</html>
