<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESTO CAFETARIA</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Loading -->
<div class="loading">
    🍽 RESTO CAFETARIA
</div>

<div class="app">

    <!-- Sidebar Server -->
    <div class="server-bar">
        <div class="server active">🍽</div>
        <div class="server">🏠</div>
        <div class="server">🛒</div>
        <div class="server">☎️</div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>RESTO CAFETARIA</h2>
            <p>Menu Restaurant</p>
        </div>

        <div class="menu">
            <button onclick="showMenu('home')">🏠 Beranda</button>
            <button onclick="showMenu('hemat')">💚 Paket Hemat</button>
            <button onclick="showMenu('medium')">⭐ Paket Medium</button>
            <button onclick="showMenu('high')">🔥 Paket High</button>
            <button onclick="showMenu('small')">🍜 Paket Small</button>
        </div>

    </aside>

    <!-- Content -->
    <main class="content">

        <div class="header">
            <h2><span class="status"></span>RESTO CAFETARIA</h2>
        </div>

        <div id="card" class="card">
            <h1>👋 Selamat Datang</h1>

            <p>Selamat datang di <b>RESTO CAFETARIA</b>.</p>

            <br>

            <p>Pilih menu makanan di sebelah kiri.</p>

            <br>

            <p>✨ Menu dibuat dengan tampilan ala Discord.</p>
        </div>

        <div class="footer">
            Made with 💜 by Rere
        </div>

    </main>

</div>

<!-- Notifikasi -->
<div id="notif" class="notif">
    ✅ Pesanan berhasil!
</div>

<script src="script.js"></script>

</body>
</html>
